<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luyện thi VSTEP B2 - Reading (7 bộ đề)</title>
<style>
  :root{
    --primary:#0d6e6e;
    --primary-dark:#084f4f;
    --primary-light:#e6f4f4;
    --accent:#1f8a8a;
    --green:#1b8f4c;
    --green-bg:#e6f7ec;
    --red:#c0392b;
    --red-bg:#fdecea;
    --border:#d7e5e5;
    --text:#1f2d2d;
    --muted:#5c6f6f;
    --white:#ffffff;
    --shadow:0 4px 14px rgba(13,110,110,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background:linear-gradient(180deg,#f2fbfb 0%, #ffffff 220px);
    color:var(--text);
    line-height:1.6;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(120deg,var(--primary-dark),var(--primary));
    color:#fff;
    padding:28px 18px 22px;
    text-align:center;
    box-shadow:var(--shadow);
  }
  header h1{margin:0 0 6px;font-size:1.6rem;}
  header p{margin:0;opacity:.9;font-size:.95rem;}

  .container{max-width:960px;margin:0 auto;padding:0 16px;}

  .toolbar{
    display:flex;justify-content:center;gap:12px;margin:18px 0;flex-wrap:wrap;
  }
  .btn{
    border:none;border-radius:8px;padding:10px 18px;font-size:.95rem;font-weight:600;
    cursor:pointer;transition:transform .15s ease, box-shadow .15s ease, background .2s ease;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--primary);color:#fff;box-shadow:var(--shadow);}
  .btn-primary:hover{background:var(--primary-dark);}
  .btn-outline{background:#fff;color:var(--primary);border:2px solid var(--primary);}
  .btn-outline:hover{background:var(--primary-light);}
  .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
  .btn-ghost:hover{background:#f2f2f2;}

  .tabs{
    display:flex;overflow-x:auto;gap:8px;padding:4px 0 10px;
    scrollbar-width:thin;
  }
  .tabs::-webkit-scrollbar{height:6px;}
  .tabs::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
  .tab-btn{
    flex:0 0 auto;
    background:#fff;border:2px solid var(--border);color:var(--primary-dark);
    padding:10px 16px;border-radius:999px;font-weight:600;font-size:.88rem;
    cursor:pointer;white-space:nowrap;transition:all .2s ease;
    position:relative;
  }
  .tab-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  .tab-btn .badge{
    display:inline-block;margin-left:6px;background:var(--green);color:#fff;
    font-size:.7rem;padding:1px 6px;border-radius:999px;
  }
  .tab-btn.active .badge{background:rgba(255,255,255,.3);}

  .card{
    background:#fff;border:1px solid var(--border);border-radius:14px;
    padding:20px;margin-bottom:18px;box-shadow:var(--shadow);
    animation:fadeIn .35s ease;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .passage-title{color:var(--primary-dark);font-size:1.15rem;margin:0 0 10px;}
  .passage-text{font-size:.97rem;text-align:justify;white-space:pre-line;color:#2b3939;}

  .section-heading{
    color:var(--primary-dark);font-size:1.05rem;margin:26px 0 12px;
    border-left:4px solid var(--primary);padding-left:10px;
  }

  .question-block{
    border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:14px;
    background:#fbfffe;transition:box-shadow .2s ease;
  }
  .question-block.answered{box-shadow:0 0 0 1px var(--border) inset;}
  .q-text{font-weight:600;margin-bottom:10px;font-size:.95rem;}
  .options{display:flex;flex-direction:column;gap:8px;}
  .option-label{
    display:flex;align-items:flex-start;gap:9px;padding:9px 12px;border-radius:8px;
    border:1px solid var(--border);cursor:pointer;font-size:.92rem;
    transition:background .18s ease, border-color .18s ease, transform .1s ease;
  }
  .option-label:hover{background:var(--primary-light);}
  .option-label input{margin-top:3px;accent-color:var(--primary);}
  .option-label.correct{
    background:var(--green-bg);border-color:var(--green);color:var(--green);
    animation:pop .25s ease;
  }
  .option-label.wrong{
    background:var(--red-bg);border-color:var(--red);color:var(--red);
    animation:shake .3s ease;
  }
  .option-label.disabled{cursor:default;opacity:.9;}
  @keyframes pop{0%{transform:scale(1);}50%{transform:scale(1.02);}100%{transform:scale(1);}}
  @keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}

  .explain{
    margin-top:10px;padding:10px 12px;border-radius:8px;font-size:.88rem;
    display:none;
  }
  .explain.show{display:block;animation:fadeIn .25s ease;}
  .explain.ok{background:var(--green-bg);color:#0f5c31;border:1px solid var(--green);}
  .explain.bad{background:var(--red-bg);color:#8a2a20;border:1px solid var(--red);}

  table.vocab{
    width:100%;border-collapse:collapse;font-size:.85rem;margin-top:8px;
    overflow:hidden;border-radius:10px;
  }
  table.vocab thead th{
    background:var(--primary);color:#fff;padding:9px 8px;text-align:left;font-weight:600;
  }
  table.vocab tbody td{
    padding:8px;border-bottom:1px solid var(--border);vertical-align:top;
  }
  table.vocab tbody tr:nth-child(even){background:var(--primary-light);}
  table.vocab .ipa{color:var(--accent);font-style:italic;white-space:nowrap;}
  .vocab-wrap{overflow-x:auto;}

  .exam-footer{
    display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;align-items:center;justify-content:space-between;
  }
  .score-pill{
    background:var(--primary-light);color:var(--primary-dark);padding:8px 14px;border-radius:999px;
    font-weight:700;font-size:.9rem;
  }

  .modal-overlay{
    position:fixed;inset:0;background:rgba(8,40,40,.55);display:none;
    align-items:center;justify-content:center;z-index:50;padding:16px;
  }
  .modal-overlay.show{display:flex;}
  .modal{
    background:#fff;border-radius:14px;max-width:480px;width:100%;padding:24px;
    box-shadow:0 12px 40px rgba(0,0,0,.25);animation:fadeIn .25s ease;
  }
  .modal h2{margin-top:0;color:var(--primary-dark);}
  .modal ul{list-style:none;padding:0;margin:14px 0;}
  .modal li{
    display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--border);
    font-size:.92rem;
  }
  .modal .total{font-weight:700;font-size:1.05rem;color:var(--primary-dark);margin-top:10px;}
  .modal-close{margin-top:16px;width:100%;}

  footer.note{
    text-align:center;color:var(--muted);font-size:.8rem;margin-top:30px;padding:0 16px;
  }

  @media(max-width:600px){
    header h1{font-size:1.25rem;}
    .card{padding:14px;}
    .tab-btn{padding:8px 12px;font-size:.8rem;}
  }
</style>
</head>

<header>

The consequences of plastic pollution extend far beyond aesthetics. Marine animals frequently mistake plastic debris for food, leading to internal injuries, starvation, and death. Seabirds, turtles, and fish are among the species most severely affected. Furthermore, toxic chemicals released from degrading plastics can accumulate in the food chain, eventually reaching humans through seafood consumption. Scientists warn that if current trends continue unabated, the amount of plastic in the ocean could outweigh fish by 2050.

  passage:`Artificial intelligence (AI) has rapidly transformed from a futuristic concept into an integral part of daily life. From virtual assistants that manage our schedules to recommendation algorithms that suggest what to watch or buy, AI systems now influence countless decisions we make every day. This remarkable progress has been driven largely by advances in machine learning, a technique that enables computers to learn patterns from vast amounts of data without being explicitly programmed for every task.

One of the most significant applications of AI lies in the healthcare sector. Machine learning algorithms can analyse medical images with a level of accuracy that rivals, and sometimes surpasses, human specialists, enabling earlier detection of diseases such as cancer. Similarly, in the field of transportation, self-driving vehicles rely on AI to interpret their surroundings and make split-second decisions, potentially reducing accidents caused by human error.

Despite these benefits, the widespread adoption of AI has also raised considerable concerns. Critics argue that automation driven by AI could displace millions of workers, particularly in industries involving routine or repetitive tasks. There are also growing anxieties regarding privacy, as AI systems often require access to enormous quantities of personal data to function effectively. Furthermore, the opacity of some AI algorithms, often referred to as "black boxes", makes it difficult to understand how certain decisions are reached, raising questions about accountability and fairness.

To address these challenges, policymakers and researchers are increasingly calling for robust regulatory frameworks that ensure AI is developed and deployed responsibly. Transparency, fairness, and human oversight are frequently cited as essential principles that should guide the future development of this technology.

  passage:`Over the past decade, online learning has evolved from a niche alternative into a mainstream mode of education embraced by millions of students worldwide. This transformation accelerated dramatically during the global pandemic, when schools and universities were forced to close their doors and shift instruction to digital platforms almost overnight. While the transition initially posed significant challenges, it also revealed the remarkable potential of technology to make education more accessible and flexible.

One of the primary advantages of online learning is its flexibility. Students can access course materials at any time and from virtually anywhere, enabling those with work or family commitments to pursue education without sacrificing other responsibilities. Additionally, online platforms often incorporate interactive elements such as quizzes, discussion forums, and multimedia content, which can enhance engagement and cater to diverse learning styles.

Nevertheless, online learning is not without its drawbacks. Many educators express concern that the lack of face-to-face interaction diminishes the sense of community and collaboration that traditional classrooms foster. Students may also struggle with self-discipline and motivation when studying independently, particularly if they lack a structured routine. Moreover, unequal access to reliable internet connectivity and digital devices has exacerbated existing educational inequalities, disproportionately affecting students from low-income backgrounds.

To mitigate these issues, many institutions have adopted a hybrid approach, blending online and in-person instruction to capture the benefits of both formats. Educators are also increasingly trained in pedagogical strategies specifically designed for virtual environments, aiming to foster genuine engagement despite the physical distance between teacher and student.

As technology continues to advance, it seems likely that online learning will remain a permanent fixture of the educational landscape, rather than a temporary substitute born out of necessity. The challenge moving forward will be to ensure that its benefits are distributed equitably across all segments of society.`,

  title:"The Importance of Sleep for Overall Well-being",
  passage:`In an era characterised by relentless schedules and constant connectivity, sleep is often the first casualty of modern lifestyles. Many people view sleep as a luxury that can be sacrificed in favour of work, socialising, or entertainment. However, mounting scientific evidence suggests that adequate sleep is not a luxury but a fundamental pillar of physical and mental health, comparable in importance to diet and exercise.

During sleep, the body undergoes essential restorative processes. Tissues repair themselves, hormones regulating growth and appetite are balanced, and the brain consolidates memories formed throughout the day. Chronic sleep deprivation, by contrast, has been linked to a wide range of adverse health outcomes, including obesity, cardiovascular disease, weakened immune function, and impaired cognitive performance. Furthermore, insufficient sleep significantly increases the risk of accidents, as reaction times and concentration deteriorate markedly when the body is deprived of adequate rest.

The psychological consequences of poor sleep are equally concerning. Research has consistently demonstrated a strong correlation between sleep deprivation and mood disorders such as anxiety and depression. Sleep-deprived individuals often exhibit heightened irritability, reduced emotional resilience, and diminished capacity to cope with everyday stressors, creating a vicious cycle in which stress further disrupts sleep quality.

Despite widespread awareness of these risks, many people continue to underestimate the value of sleep, often boasting about functioning on minimal rest as though it were a badge of honour. Sleep experts strongly caution against this mindset, emphasising that the body cannot be trained to require less sleep; rather, chronic sleep debt accumulates silently, exacting a toll that becomes increasingly apparent over time.

To improve sleep quality, specialists recommend establishing a consistent sleep schedule, limiting exposure to screens before bedtime, and creating a calm, dark sleeping environment. Ultimately, prioritising sleep should be regarded not as an indulgence, but as an indispensable investment in long-term health and productivity.`,

  title:"The Emergence of Remote Work",
  passage:`The concept of remote work, once considered a rare privilege reserved for a select few, has become an increasingly common feature of the modern professional landscape. Accelerated by advances in digital communication technology and further propelled by the global pandemic, remote work has fundamentally reshaped how organisations operate and how employees perceive the boundaries between their professional and personal lives.

Proponents of remote work frequently highlight its numerous benefits. Employees often report greater autonomy over their schedules, eliminating lengthy commutes and allowing for a more favourable work-life balance. Employers, meanwhile, can benefit from reduced overhead costs associated with maintaining physical office spaces, while simultaneously gaining access to a broader talent pool unconstrained by geographical location.

Nevertheless, the shift towards remote work has not been without its complications. Many managers express concern that physical distance can undermine team cohesion and hinder spontaneous collaboration, which often flourishes through casual, in-person interactions. Employees, too, report feelings of isolation and difficulty separating work from home life, particularly when household distractions blur the line between professional obligations and domestic responsibilities. Some studies suggest that remote workers, ironically, tend to work longer hours than their office-based counterparts, as the absence of a clear physical boundary between work and rest makes it more difficult to disconnect.

In response to these challenges, many companies have adopted hybrid models that combine remote flexibility with periodic in-person collaboration, attempting to capture the advantages of both arrangements. Organisations are also investing in digital tools designed to facilitate communication and maintain a sense of connection among dispersed teams.

As remote work continues to evolve, it is becoming increasingly clear that a one-size-fits-all approach is unlikely to suit every industry or individual. Instead, the future of work will likely be characterised by greater flexibility, with organisations tailoring their arrangements to the specific needs of their workforce and business objectives.`,

{
  id:"travel", topic:"Travel & Culture", vnTopic:"Du lịch & Văn hóa",
  title:"The Impact of Tourism on Local Communities",
  passage:`Tourism has long been regarded as a powerful engine of economic growth, generating employment and revenue for countless communities around the world. From bustling metropolises to remote rural villages, destinations that attract visitors often experience significant improvements in infrastructure, ranging from transportation networks to healthcare facilities. However, as global travel has become increasingly accessible, the phenomenon of overtourism has emerged as a pressing concern, prompting a re-evaluation of the true costs and benefits of tourism.

Local communities often find themselves caught between conflicting interests. While tourism provides essential income, it can simultaneously displace residents from their own neighbourhoods as property prices soar and traditional housing is converted into short-term rentals. Moreover, the cultural authenticity that initially attracted visitors can gradually erode, as local traditions are commodified and reshaped to satisfy tourist demand rather than to preserve genuine heritage.

/* ========================= STATE & STORAGE ========================= */
const STORAGE_KEY = "vstepB2ReadingProgress";
let progress = loadProgress();
let activeExamId = exams[0].id;

function loadProgress(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return {};
    return JSON.parse(raw);
  }catch(e){ return {}; }
}
function saveProgress(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }catch(e){}
}
function getExamState(examId){
  if(!progress[examId]){
    progress[examId] = { answers:{} }; // {questionIndex: selectedOptionIndex}
  }
  return progress[examId];
}

/* ========================= RENDER TABS ========================= */
function renderTabs(){
  const tabsEl = document.getElementById("tabs");
  tabsEl.innerHTML = "";
  exams.forEach(exam=>{
    const st = getExamState(exam.id);
    const answeredCount = Object.keys(st.answers).length;
    const btn = document.createElement("button");
    btn.className = "tab-btn" + (exam.id===activeExamId ? " active" : "");
    btn.innerHTML = exam.vnTopic + (answeredCount>0 ? ` <span class="badge">${answeredCount}/5</span>` : "");
    btn.addEventListener("click", ()=>{
      activeExamId = exam.id;
      renderTabs();
      renderExam();
    });
    tabsEl.appendChild(btn);
  });
}

/* ========================= RENDER EXAM ========================= */
function renderExam(){
  const exam = exams.find(e=>e.id===activeExamId);
  const state = getExamState(exam.id);
  const area = document.getElementById("examArea");
  area.innerHTML = "";

  // Passage card
  const passageCard = document.createElement("div");
  passageCard.className = "card";
  passageCard.innerHTML = `
    <h2 class="passage-title">📖 ${exam.title}</h2>
    <div class="passage-text">${escapeHtml(exam.passage)}</div>
  `;
  area.appendChild(passageCard);

  // Questions card
  const qCard = document.createElement("div");
  qCard.className = "card";
  qCard.innerHTML = `<h3 class="section-heading" style="margin-top:0;">✏️ Câu hỏi trắc nghiệm</h3>`;

  exam.questions.forEach((q, qi)=>{
    const answeredIdx = state.answers[qi];
    const qBlock = document.createElement("div");
    qBlock.className = "question-block" + (answeredIdx!==undefined ? " answered" : "");
    qBlock.dataset.qi = qi;

    let optsHtml = "";
    q.options.forEach((opt, oi)=>{
      let cls = "option-label";
      if(answeredIdx!==undefined){
        cls += " disabled";
        if(oi===q.correct) cls += " correct";
        else if(oi===answeredIdx) cls += " wrong";
      }
      optsHtml += `
        <label class="${cls}" data-oi="${oi}">
          <input type="radio" name="q_${exam.id}_${qi}" value="${oi}" ${answeredIdx!==undefined ? "disabled" : ""} ${answeredIdx===oi ? "checked" : ""}>
          <span>${String.fromCharCode(65+oi)}. ${escapeHtml(opt)}</span>
        </label>`;
    });

    let explainHtml = "";
    if(answeredIdx!==undefined){
      const isCorrect = answeredIdx===q.correct;
      explainHtml = `<div class="explain show ${isCorrect?'ok':'bad'}">${isCorrect?'✅':'❌'} ${escapeHtml(q.explain[answeredIdx])}</div>`;
      if(!isCorrect){
        explainHtml += `<div class="explain show ok">✅ Đáp án đúng: ${String.fromCharCode(65+q.correct)}. ${escapeHtml(q.explain[q.correct])}</div>`;
      }
    }

    qBlock.innerHTML = `
      <div class="q-text">Câu ${qi+1}: ${escapeHtml(q.q)}</div>
      <div class="options">${optsHtml}</div>
      ${explainHtml}
    `;
    qCard.appendChild(qBlock);
  });

  // footer with score & buttons
  const answeredTotal = Object.keys(state.answers).length;
  const correctTotal = Object.entries(state.answers).filter(([qi,oi])=> exam.questions[qi].correct===oi).length;

  const footer = document.createElement("div");
  footer.className = "exam-footer";
  footer.innerHTML = `
    <span class="score-pill">Điểm bộ đề này: ${correctTotal}/5 (${answeredTotal}/5 đã làm)</span>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn btn-outline" id="btnCheckExam">✅ Kiểm tra</button>
      <button class="btn btn-ghost" id="btnResetExam">♻️ Reset bộ đề</button>
    </div>
  `;
  qCard.appendChild(footer);
  area.appendChild(qCard);

  // Vocabulary card
  const vocabCard = document.createElement("div");
  vocabCard.className = "card";
  let rows = "";
  exam.vocabulary.forEach(v=>{
    rows += `
      <tr>
        <td><strong>${escapeHtml(v.word)}</strong><br><span class="ipa">${escapeHtml(v.ipa)}</span></td>
        <td>${escapeHtml(v.noun)}</td>
        <td>${escapeHtml(v.verb)}</td>
        <td>${escapeHtml(v.adj)}</td>
        <td>${escapeHtml(v.adv)}</td>
        <td>${escapeHtml(v.meaning)}</td>
      </tr>`;
  });
  vocabCard.innerHTML = `
    <h3 class="section-heading" style="margin-top:0;">📚 Từ vựng học thuật (Word Family)</h3>
    <div class="vocab-wrap">
      <table class="vocab">
        <thead>
          <tr><th>Từ gốc / IPA</th><th>Danh từ (N)</th><th>Động từ (V)</th><th>Tính từ (Adj)</th><th>Trạng từ (Adv)</th><th>Nghĩa tiếng Việt</th></tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `;
  area.appendChild(vocabCard);

  // Event: option select -> immediate feedback
  qCard.querySelectorAll(".option-label").forEach(label=>{
    label.addEventListener("click", function(){
      const qBlock = this.closest(".question-block");
      const qi = parseInt(qBlock.dataset.qi, 10);
      const st = getExamState(exam.id);
      if(st.answers[qi]!==undefined) return; // already answered
      const oi = parseInt(this.dataset.oi, 10);
      st.answers[qi] = oi;
      saveProgress();
      renderTabs();
      renderExam();
    });
  });

  document.getElementById("btnCheckExam").addEventListener("click", ()=>{
    const st = getExamState(exam.id);
    const unanswered = exam.questions.map((_,i)=>i).filter(i=> st.answers[i]===undefined);
    if(unanswered.length>0){
      alert(`Bạn còn ${unanswered.length} câu chưa trả lời: Câu ${unanswered.map(i=>i+1).join(", ")}. Hãy chọn đáp án cho tất cả các câu.`);
      return;
    }
    const correct = Object.entries(st.answers).filter(([qi,oi])=> exam.questions[qi].correct===oi).length;
    alert(`Kết quả bộ đề "${exam.vnTopic}": ${correct}/5 câu đúng.`);
  });

  document.getElementById("btnResetExam").addEventListener("click", ()=>{
    if(!confirm(`Bạn có chắc muốn làm lại bộ đề "${exam.vnTopic}" từ đầu không?`)) return;
    progress[exam.id] = { answers:{} };
    saveProgress();
    renderTabs();
    renderExam();
  });
}

function escapeHtml(str){
  return String(str)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

/* ========================= TOTAL SCORE MODAL ========================= */
function showTotalScore(){
  const list = document.getElementById("modalList");
  list.innerHTML = "";
  let totalCorrect = 0, totalQuestions = 0;
  exams.forEach(exam=>{
    const st = getExamState(exam.id);
    const correct = Object.entries(st.answers).filter(([qi,oi])=> exam.questions[qi].correct===oi).length;
    const answered = Object.keys(st.answers).length;
    totalCorrect += correct;
    totalQuestions += exam.questions.length;
    const li = document.createElement("li");
    li.innerHTML = `<span>${exam.vnTopic}</span><span>${correct}/5 đúng (${answered}/5 đã làm)</span>`;
    list.appendChild(li);
  });
  document.getElementById("modalTotal").textContent = `Tổng cộng: ${totalCorrect}/${totalQuestions} câu đúng`;
  document.getElementById("modalOverlay").classList.add("show");
}

document.getElementById("btnTotalScore").addEventListener("click", showTotalScore);
document.getElementById("modalClose").addEventListener("click", ()=>{
  document.getElementById("modalOverlay").classList.remove("show");
});
document.getElementById("modalOverlay").addEventListener("click", (e)=>{
  if(e.target.id==="modalOverlay") document.getElementById("modalOverlay").classList.remove("show");
});

document.getElementById("btnResetAll").addEventListener("click", ()=>{
  if(!confirm("Bạn có chắc muốn xóa TOÀN BỘ tiến độ của cả 7 bộ đề không? Hành động này không thể hoàn tác.")) return;
  progress = {};
  saveProgress();
  renderTabs();
  renderExam();
});

/* ========================= INIT ========================= */
renderTabs();
renderExam();
</script>
